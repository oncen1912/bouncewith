name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only

  database:
    name: Migrations, pgTAP, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Postgres and apply migrations + seed
        run: npx supabase db start
      - name: pgTAP / RLS tests
        run: npx supabase test db
      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code shared/database.types.ts || {
            echo "::error::shared/database.types.ts is stale. Run 'npm run db:types' and commit."
            exit 1
          }
