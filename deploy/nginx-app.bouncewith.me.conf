# nginx site for app.bouncewith.me (static SPA build from web/dist, rsynced by .github/workflows/deploy.yml).
# TLS via certbot. Adjust root to the REMOTE_TARGET secret.
server {
  listen 443 ssl http2;
  server_name app.bouncewith.me;
  root /var/www/app.bouncewith.me;
  index index.html;

  # ssl_certificate / ssl_certificate_key managed by certbot

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # hashed assets: cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # embeddable widget: loaded cross-origin by customer websites, short cache
  location = /widget.js {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # SPA fallback: every route is handled by the Vue router
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name app.bouncewith.me;
  return 301 https://$host$request_uri;
}
